<title>EstateDesk</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Instrument+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: sidebar + working area on desktop, bottom tab bar on phones. Blueprint ink accent, site-tape yellow for things that need attention. */
:root{
  --bg:#f2f4f7; --surface:#ffffff; --surface-2:#eef1f5; --line:#dce1e8; --line-2:#c9d0da;
  --fg:#152030; --muted:#5a6575; --faint:#8a94a3;
  --accent:#1d4e89; --accent-fg:#ffffff; --accent-soft:#e2ebf6;
  --tape:#b97c00; --tape-soft:#fbefd2;
  --hot:#b8382a; --hot-soft:#fbe4df; --warm:#9a6a08; --warm-soft:#f8ecd0; --cold:#33729f; --cold-soft:#e0edf6;
  --good:#2b7a4b; --good-soft:#dff1e6; --bad:#b8382a;
  --shadow:0 1px 2px rgba(21,32,48,.06),0 8px 24px rgba(21,32,48,.06);
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Instrument Sans","Segoe UI",system-ui,-apple-system,sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e131a; --surface:#151c26; --surface-2:#1b2431; --line:#273242; --line-2:#334054;
  --fg:#e5ebf3; --muted:#9ba7b8; --faint:#6f7b8c;
  --accent:#7eb0ea; --accent-fg:#0e131a; --accent-soft:#1b2c43;
  --tape:#e6b04a; --tape-soft:#352a12;
  --hot:#f08a7a; --hot-soft:#3a1d19; --warm:#e2b25a; --warm-soft:#33280f; --cold:#83b8de; --cold-soft:#16283a;
  --good:#6cc794; --good-soft:#15301f; --bad:#f08a7a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e131a; --surface:#151c26; --surface-2:#1b2431; --line:#273242; --line-2:#334054;
  --fg:#e5ebf3; --muted:#9ba7b8; --faint:#6f7b8c;
  --accent:#7eb0ea; --accent-fg:#0e131a; --accent-soft:#1b2c43;
  --tape:#e6b04a; --tape-soft:#352a12;
  --hot:#f08a7a; --hot-soft:#3a1d19; --warm:#e2b25a; --warm-soft:#33280f; --cold:#83b8de; --cold-soft:#16283a;
  --good:#6cc794; --good-soft:#15301f; --bad:#f08a7a;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select,textarea{font:inherit;color:inherit}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-size:24px;font-weight:700}
h2{font-size:17px;font-weight:600}
h3{font-size:14px;font-weight:600;font-family:var(--f-body)}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.muted{color:var(--muted)} .faint{color:var(--faint)}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

.app{display:grid;grid-template-columns:228px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;padding:18px 12px;border-right:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}
.brand-name{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.1}
.brand-sub{font-size:11px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav button{display:flex;align-items:center;gap:10px;padding:9px 10px;border:0;background:none;border-radius:8px;cursor:pointer;text-align:left;color:var(--muted);font-weight:500}
.nav button:hover{background:var(--surface-2);color:var(--fg)}
.nav button.on{background:var(--accent-soft);color:var(--accent)}
.nav .count{margin-left:auto;font-family:var(--f-mono);font-size:11px;background:var(--tape-soft);color:var(--tape);padding:1px 7px;border-radius:99px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:6px;padding:0 4px}
.side-foot select{width:100%}

.main{min-width:0;padding-inline:28px;padding-block:20px 60px}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.top h1{margin-right:auto}
.gsearch{position:relative;flex:0 1 300px;min-width:0}
.gsearch input[type=search]{width:100%;padding-left:32px}
.gsearch svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint)}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 14px;border-radius:var(--r);background:var(--tape-soft);color:var(--fg);margin-bottom:16px;font-size:13px}
.banner b{color:var(--tape)}

input[type=text],input[type=tel],input[type=email],input[type=number],input[type=date],input[type=datetime-local],input[type=search],select,textarea{
  background:var(--surface);border:1px solid var(--line-2);border-radius:8px;padding:8px 10px;min-width:0;max-width:100%}
textarea{width:100%;resize:vertical;min-height:72px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:8px 13px;border-radius:8px;border:1px solid var(--line-2);background:var(--surface);cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--fg)}
.btn:hover{border-color:var(--faint)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.ghost{border-color:transparent;background:none}
.btn.ghost:hover{background:var(--surface-2)}
.btn.sm{padding:5px 9px;font-size:13px}
.btn.wa{background:#1f8f55;border-color:#1f8f55;color:#fff}
.btn.danger{color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.iconbtn{border:0;background:none;padding:6px;border-radius:6px;cursor:pointer;color:var(--muted);display:inline-grid;place-items:center}
.iconbtn:hover{background:var(--surface-2);color:var(--fg)}

.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:500;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.chip.hot{background:var(--hot-soft);color:var(--hot)} .chip.warm{background:var(--warm-soft);color:var(--warm)} .chip.cold{background:var(--cold-soft);color:var(--cold)}
.chip.good{background:var(--good-soft);color:var(--good)} .chip.tape{background:var(--tape-soft);color:var(--tape)} .chip.acc{background:var(--accent-soft);color:var(--accent)}
.chip.bad{background:var(--hot-soft);color:var(--hot)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--faint)}
.dot.hot{background:var(--hot)}.dot.warm{background:var(--warm)}.dot.cold{background:var(--cold)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:12px}
.panel-h{display:flex;align-items:center;gap:10px;padding:14px 16px 10px;flex-wrap:wrap}
.panel-h h2{margin-right:auto}
.panel-b{padding:0 16px 16px}
.empty{padding:22px 16px;color:var(--muted);text-align:center;font-size:13px}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:18px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:left}
.kpi:hover{border-color:var(--line-2)}
.kpi .n{font-family:var(--f-display);font-size:28px;font-weight:700;line-height:1.1;font-variant-numeric:tabular-nums}
.kpi.alert{border-color:var(--tape);background:linear-gradient(var(--tape-soft),var(--surface) 70%)}
.kpi.alert .n{color:var(--tape)}

.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:16px;align-items:start}
.stack{display:flex;flex-direction:column;gap:16px}

/* Lead rows */
.rows{display:flex;flex-direction:column}
.row{display:grid;grid-template-columns:minmax(150px,1.3fr) minmax(140px,1.4fr) 120px 110px 130px auto;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--surface-2)}
.row.head{cursor:default;background:none;font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600;padding-block:8px}
.row .name{font-weight:600;display:flex;align-items:center;gap:7px;min-width:0}
.row .name span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .sub{font-size:12px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .acts{display:flex;gap:4px;justify-content:flex-end}
.fu{font-size:12px;font-weight:500}
.fu.over{color:var(--hot)} .fu.today{color:var(--tape)} .fu.later{color:var(--muted)}
.callrow{grid-template-columns:minmax(0,1fr) auto}

.filters{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:12px}
.filters select{padding:6px 8px;font-size:13px}
.fsel{display:contents}.ftog{display:none}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer;font-size:13px;color:var(--muted)}
.seg button.on{background:var(--accent);color:var(--accent-fg)}

/* Board */
.board{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;align-items:flex-start}
.col{flex:0 0 232px;background:var(--surface-2);border-radius:12px;padding:8px;min-height:120px}
.col.over{outline:2px dashed var(--accent);outline-offset:-2px}
.col-h{display:flex;align-items:center;gap:6px;padding:4px 6px 8px;font-weight:600;font-size:13px}
.col-h .mono{margin-left:auto;color:var(--muted);font-size:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-bottom:6px;cursor:grab;display:flex;flex-direction:column;gap:3px}
.card:hover{border-color:var(--line-2)}
.card .t{font-weight:600;display:flex;align-items:center;gap:6px}
.card .s{font-size:12px;color:var(--muted)}

/* Drawer & modal */
.scrim{position:fixed;inset:0;background:rgba(10,16,24,.38);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100%);background:var(--bg);z-index:41;overflow-y:auto;box-shadow:var(--shadow);border-left:1px solid var(--line);padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dr-h{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 18px;z-index:2}
.dr-b{padding:16px 18px;display:flex;flex-direction:column;gap:14px}
.dr-title{display:flex;align-items:flex-start;gap:10px}
.dr-title h2{font-size:21px;margin-right:auto}
.acts-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.sec{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;align-items:center;gap:8px}
.sec-h h3{margin-right:auto}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px 16px}
.kv div{min-width:0}
.kv .v{font-weight:500;overflow-wrap:anywhere}
.stages{display:flex;flex-wrap:wrap;gap:5px}
.stages button{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:4px 10px;font-size:12px;cursor:pointer;color:var(--muted)}
.stages button.done{background:var(--accent-soft);border-color:transparent;color:var(--accent)}
.stages button.cur{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.stages button.lost{border-style:dashed}
.stages button.lost.cur{background:var(--hot);border-color:var(--hot);color:#fff}
.tl{display:flex;flex-direction:column}
.tl-i{display:grid;grid-template-columns:26px minmax(0,1fr);gap:8px;padding:7px 0;border-top:1px solid var(--line)}
.tl-i:first-child{border-top:0}
.tl-ic{width:26px;height:26px;border-radius:50%;background:var(--surface-2);display:grid;place-items:center;color:var(--muted)}
.tl-t{font-size:13px;overflow-wrap:anywhere;white-space:pre-wrap}
.tl-m{font-size:11px;color:var(--faint)}
.quick{display:flex;gap:5px;flex-wrap:wrap;align-items:center}

.modal-wrap{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px;background:rgba(10,16,24,.42)}
.modal{background:var(--bg);border-radius:14px;width:min(640px,100%);max-height:calc(100vh - 32px);overflow-y:auto;box-shadow:var(--shadow);border:1px solid var(--line)}
.modal.wide{width:min(860px,100%)}
.m-h{display:flex;align-items:center;gap:10px;padding:16px 18px 6px}
.m-h h2{margin-right:auto}
.m-b{padding:10px 18px 4px;display:flex;flex-direction:column;gap:12px}
.m-f{display:flex;gap:8px;justify-content:flex-end;padding:14px 18px 18px;flex-wrap:wrap}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field.full{grid-column:1/-1}
.field input,.field select,.field textarea{width:100%}
.hint{font-size:12px;color:var(--muted)}
.warn{padding:9px 12px;border-radius:8px;background:var(--tape-soft);font-size:13px}
.err{padding:9px 12px;border-radius:8px;background:var(--hot-soft);color:var(--hot);font-size:13px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line-2);background:var(--surface);padding:5px 10px;border-radius:8px;cursor:pointer;font-size:13px}
.pick button.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tabs button{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tabs button.on{color:var(--accent);border-bottom-color:var(--accent)}

.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:60;font-size:13px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

/* Projects, visits, templates */
.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:12px}
.pcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.pcard h2{font-size:16px}
.price{font-family:var(--f-display);font-size:19px;font-weight:600}
.stats3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;border-top:1px solid var(--line);padding-top:8px;margin-top:auto}
.stats3 .n{font-family:var(--f-mono);font-size:16px;font-weight:500}
.day-h{padding:12px 16px 4px;font-weight:600;font-size:13px;color:var(--muted)}
.vrow{display:grid;grid-template-columns:70px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px;border-top:1px solid var(--line)}
.vtime{font-family:var(--f-mono);font-weight:500}
.tpl{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px}
.tpl pre{white-space:pre-wrap;font-family:var(--f-body);margin:0;font-size:13px;color:var(--muted);max-height:150px;overflow:hidden;mask-image:linear-gradient(#000 70%,transparent)}
.bubble{background:#dcf5c8;color:#14241a;border-radius:10px 10px 10px 2px;padding:10px 12px;white-space:pre-wrap;font-size:13.5px;max-width:420px}
.vars{display:flex;flex-wrap:wrap;gap:5px}
.vars button{font-family:var(--f-mono);font-size:11.5px;border:1px dashed var(--line-2);background:var(--surface);border-radius:6px;padding:3px 7px;cursor:pointer;color:var(--accent)}

/* Reports */
.funnel{display:flex;flex-direction:column;gap:7px}
.fbar{display:grid;grid-template-columns:120px minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:13px}
.fbar .track{height:22px;background:var(--surface-2);border-radius:6px;overflow:hidden}
.fbar .fill{height:100%;background:var(--accent);border-radius:6px;min-width:2px}
.fbar .fill.booked{background:var(--good)}
.fbar .num{text-align:right;font-family:var(--f-mono);font-size:12.5px}
.tbl-wrap{overflow-x:auto}
table.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.tbl input{width:110px;padding:5px 8px}
.hbar{height:6px;border-radius:3px;background:var(--accent);opacity:.75}

.bottomnav{display:none}
.more-sheet{position:fixed;left:12px;right:12px;bottom:calc(70px + env(safe-area-inset-bottom,0px));background:var(--surface);border:1px solid var(--line);border-radius:12px;z-index:31;padding:6px;box-shadow:var(--shadow)}
.more-sheet button{display:flex;gap:10px;align-items:center;width:100%;border:0;background:none;padding:12px;border-radius:8px;cursor:pointer;text-align:left}

@media (max-width:1100px){.grid2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  .main{padding-inline:16px;padding-block:14px 96px}
  .bottomnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:30;padding-bottom:env(safe-area-inset-bottom,0px)}
  .bottomnav button{border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--muted);cursor:pointer;position:relative}
  .bottomnav button.on{color:var(--accent)}
  .bottomnav .badge{position:absolute;top:4px;left:calc(50% + 6px);background:var(--tape);color:#fff;font-size:10px;border-radius:99px;padding:0 5px;font-family:var(--f-mono)}
  .row{grid-template-columns:minmax(0,1fr) auto;gap:4px 10px}
  .row.head{display:none}
  .row .c-req{grid-column:1/-1;order:3}
  .row .c-stage,.row .c-src{display:none}
  .row .c-fu{order:2;text-align:right}
  .row .acts{display:none}
  .gsearch{flex:1 1 100%;order:3}
  .form{grid-template-columns:minmax(0,1fr)}
  .ftog{display:inline-flex}.fsel{display:none}.fsel.open{display:flex;flex-wrap:wrap;gap:8px;width:100%}.fsel.open select{flex:1 1 140px}
  .fbar{grid-template-columns:90px minmax(0,1fr) 80px}
  .vrow{grid-template-columns:56px minmax(0,1fr)}
  .vrow .vacts{grid-column:1/-1}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slin .18s ease-out}.modal{animation:pop .15s ease-out}}
@keyframes slin{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.98);opacity:.6}to{transform:none;opacity:1}}
</style>

<div class="app">
  <aside class="side" id="side"></aside>
  <main class="main" id="main"><div class="empty">Loading your CRM…</div></main>
</div>
<nav class="bottomnav" id="bnav"></nav>
<div id="drawer-root"></div>
<div id="modal-root"></div>
<div id="toast-root"></div>

<script>
/* ============ Constants ============ */
const STAGES=[
  {k:'new',l:'New'},{k:'contacted',l:'Contacted'},{k:'qualified',l:'Interested'},{k:'visit',l:'Visit scheduled'},
  {k:'visited',l:'Visit done'},{k:'negotiation',l:'Negotiation'},{k:'token',l:'Token paid'},{k:'booked',l:'Booked'}];
const STAGE_IDX=Object.fromEntries(STAGES.map((s,i)=>[s.k,i]));
const stageLabel=k=>k==='lost'?'Lost':(STAGES.find(s=>s.k===k)||{l:k}).l;
const DEFAULT_SOURCES=['99acres','MagicBricks','Housing.com','Facebook','Instagram','Google Ads','Website','Walk-in','Referral','Channel partner','Bulk call','Other'];

/* ============ Store & persistence ============ */
const COLS=['leads','projects','visits','templates','team','meta'];
const store={leads:{},projects:{},visits:{},templates:{},team:{},meta:{}};
let MODE='loading', DB=null, CAN_WRITE=true, SAMPLE=null, DL=null;
const loaded=new Set();
const LS_KEY='estatedesk-local-v1';
const queues={};

function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(k,v)}catch(e){}}

function startLocal(){
  if(MODE==='cloud')return;
  MODE='local';
  try{const raw=lsGet(LS_KEY); if(raw){const o=JSON.parse(raw); COLS.forEach(c=>store[c]=o[c]||{});}}catch(e){}
  COLS.forEach(c=>loaded.add(c));
  scheduleRender();
}
function persistLocal(){lsSet(LS_KEY,JSON.stringify(store))}

async function boot(){
  state.me=lsGet('ed-me')||'';
  render();
  if(!window.claude||typeof window.claude.use!=='function'){startLocal();return}
  let db=null;
  try{db=await window.claude.use('db')}catch(e){db=null}
  if(!db){startLocal();return}
  DB=db; MODE='cloud';
  COLS.forEach(c=>{
    db.collection(c).onSnapshot(snap=>{
      const o={}; snap.docs.forEach(d=>{if(d.exists)o[d.id]={...d.data(),id:d.id}});
      store[c]=o; loaded.add(c); scheduleRender();
    },err=>{toast('Lost the live connection to your data. Reload the page to reconnect.')});
  });
  window.claude.use('user').then(u=>{if(u)u.can('data.write').then(v=>{if(v===false){CAN_WRITE=false;scheduleRender()}})}).catch(()=>{});
  window.claude.use('sample').then(s=>{SAMPLE=s;scheduleRender()}).catch(()=>{});
  window.claude.use('downloads').then(d=>{DL=d}).catch(()=>{});
}

function guardWrite(){
  if(!CAN_WRITE){toast('You can view this CRM but not change it. Ask the owner to give you Editor access.');return false}
  return true;
}
function save(col,obj){
  if(!guardWrite())return Promise.resolve(false);
  obj.updatedAt=new Date().toISOString();
  store[col]={...store[col],[obj.id]:obj};
  scheduleRender();
  if(MODE!=='cloud'){persistLocal();return Promise.resolve(true)}
  const key=col+'/'+obj.id, data=JSON.parse(JSON.stringify(obj));
  queues[key]=(queues[key]||Promise.resolve()).then(()=>DB.collection(col).doc(obj.id).set(data)).then(()=>true).catch(writeErr);
  return queues[key];
}
function removeDoc(col,id){
  if(!guardWrite())return Promise.resolve(false);
  const n={...store[col]}; delete n[id]; store[col]=n; scheduleRender();
  if(MODE!=='cloud'){persistLocal();return Promise.resolve(true)}
  const key=col+'/'+id;
  queues[key]=(queues[key]||Promise.resolve()).then(()=>DB.collection(col).doc(id).delete()).then(()=>true).catch(writeErr);
  return queues[key];
}
function writeErr(e){
  const c=e&&e.code;
  if(c==='invalid_argument'){CAN_WRITE=false;toast('This change was not saved. You have view-only access.')}
  else if(c==='quota_exceeded')toast('Storage is full. Delete old leads or example data in Settings, then try again.');
  else if(c==='resource_exhausted')toast('Too many changes at once. Wait a few seconds and try again.');
  else toast('Could not save. Check your connection and try again.');
  scheduleRender(); return false;
}
function upd(col,id,fn){const cur=store[col][id]; if(!cur)return; const o=JSON.parse(JSON.stringify(cur)); fn(o); return save(col,o)}

function normPhone(p){const d=String(p||'').replace(/\D/g,''); if(d.length>10&&d.startsWith('91'))return d.slice(-10); if(d.length===11&&d.startsWith('0'))return d.slice(1); return d}

function fmtPhone(p){const n=normPhone(p); return n.length===10?n.slice(0,5)+' '+n.slice(5):(p||'')}
function fmtL(l){if(l==null||l===''||isNaN(l))return ''; l=+l; if(l>=100){const c=l/100; return '₹'+(Math.round(c*100)/100)+' Cr'} return '₹'+(Math.round(l*10)/10)+' L'}
function fmtBudget(ld){const a=ld.budgetMin,b=ld.budgetMax; if(a&&b&&a!==b)return fmtL(a)+' – '+fmtL(b).replace('₹',''); if(b)return 'Up to '+fmtL(b); if(a)return fmtL(a)+'+'; return ''}
function parseBudget(s){
  if(s==null)return null; s=String(s).toLowerCase().replace(/,/g,'').replace(/rs\.?|inr|₹/g,' ');
  const parts=s.split(/\s*(?:-|–|to)\s*/); const v=[];
  for(const p of parts){const m=p.match(/(\d+(?:\.\d+)?)\s*(cr|crore|crores|l|lac|lacs|lakh|lakhs|k|thousand)?/); if(m)v.push([+m[1],m[2]||''])}
  if(!v.length)return null;
  const unit=u=>u?(u[0]==='c'?'cr':u[0]==='l'?'l':'k'):'';
  const lastU=unit(v[v.length-1][1]);
  const toL=([n,u])=>{u=unit(u)||lastU; if(u==='cr')return n*100; if(u==='l')return n; if(u==='k')return n/100; if(n>=100000)return n/100000; if(n<10)return n*100; return n};
  const nums=v.map(toL).map(x=>Math.round(x*100)/100);
  if(nums.length===1)return {min:null,max:nums[0]};
  return {min:Math.min(...nums),max:Math.max(...nums)};
}
function parseDate(s){
  if(!s)return null; s=String(s).trim();
  let m=s.match(/^(\d{1,2})[\/\-. ](\d{1,2})[\/\-. ](\d{2,4})$/);
  if(m){let y=+m[3]; if(y<100)y+=y>30?1900:2000; const mo=+m[2],d=+m[1]; if(mo<1||mo>12||d<1||d>31)return null; return `${y}-${String(mo).padStart(2,'0')}-${String(d).padStart(2,'0')}`}
  m=s.match(/^(\d{4})-(\d{2})-(\d{2})/); if(m)return m[0];
  const d=new Date(s); if(!isNaN(d)&&d.getFullYear()>1900)return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  return null;
}
const now=()=>new Date();
const sameDay=(a,b)=>a.getFullYear()===b.getFullYear()&&a.getMonth()===b.getMonth()&&a.getDate()===b.getDate();
const fmtDay=iso=>iso?new Date(iso).toLocaleDateString('en-IN',{weekday:'short',day:'numeric',month:'short'}):'';
const fmtTime=iso=>iso?new Date(iso).toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit'}):'';
const fmtDT=iso=>iso?fmtDay(iso)+', '+fmtTime(iso):'';
const fmtDob=d=>{if(!d)return ''; const [y,m,dd]=d.split('-'); return new Date(+y,+m-1,+dd).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'})};
function rel(iso){if(!iso)return ''; const d=(new Date(iso)-Date.now())/60000, a=Math.abs(d); if(a<1)return 'just now'; let s; if(a<60)s=Math.round(a)+' min'; else if(a<1440)s=Math.round(a/60)+' hr'; else s=Math.round(a/1440)+' d'; return d<0?s+' ago':'in '+s}
function toLocalInput(iso){if(!iso)return ''; const d=new Date(iso); const p=n=>String(n).padStart(2,'0'); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`}
function fromLocalInput(v){if(!v)return null; const d=new Date(v); return isNaN(d)?null:d.toISOString()}
function fuState(iso){if(!iso)return ''; const d=new Date(iso), n=now(); if(d<n)return 'over'; if(sameDay(d,n))return 'today'; return 'later'}
function fuText(iso){const s=fuState(iso); if(!s)return ''; if(s==='over')return 'Overdue '+rel(iso).replace(' ago',''); if(s==='today')return 'Today '+fmtTime(iso); return fmtDT(iso)}
function addHours(h){return new Date(Date.now()+h*3600000).toISOString()}
function tomorrowAt(h){const d=new Date(); d.setDate(d.getDate()+1); d.setHours(h,0,0,0); return d.toISOString()}
function inDaysAt(n,h){const d=new Date(); d.setDate(d.getDate()+n); d.setHours(h,0,0,0); return d.toISOString()}
function birthdaySoon(dob,days=7){if(!dob)return null; const [,m,d]=dob.split('-').map(Number); const n=now(); n.setHours(0,0,0,0); let b=new Date(n.getFullYear(),m-1,d); if(b<n)b=new Date(n.getFullYear()+1,m-1,d); const diff=Math.round((b-n)/86400000); return diff<=days?diff:null}

function leadActivity(lead,type,text,extra){
  lead.activity=lead.activity||[];
  lead.activity.unshift({at:new Date().toISOString(),by:state.me||'',type,text,...(extra||{})});
  if(lead.activity.length>200)lead.activity.length=200;
  lead.lastActivityAt=lead.activity[0].at;
}
function setStageOn(lead,stage){
  if(lead.stage===stage)return;
  const prev=lead.stage; lead.stage=stage;
  if(stage!=='lost'){lead.maxStage=Math.max(lead.maxStage??0,STAGE_IDX[stage]??0); lead.lostReason=''}
  if(stage==='booked'&&!lead.bookedAt)lead.bookedAt=new Date().toISOString();
  leadActivity(lead,'stage',`Stage: ${stageLabel(prev)} → ${stageLabel(stage)}`);
}
const leadByPhone=p=>{const n=normPhone(p); if(n.length<8)return null; return vals(store.leads).find(l=>normPhone(l.phone)===n)||null};
function nextAssignee(){
  const t=teamList().filter(m=>m.role!=='admin'||teamList().length===1); if(!t.length)return '';
  const counts={}; t.forEach(m=>counts[m.id]=0);
  vals(store.leads).forEach(l=>{if(counts[l.assignedTo]!=null&&!['booked','lost'].includes(l.stage))counts[l.assignedTo]++});
  return t.sort((a,b)=>counts[a.id]-counts[b.id])[0].id;
}
function matchProjects(lead){
  const words=(lead.location||'').toLowerCase().split(/[\s,]+/).filter(w=>w.length>3);
  return vals(store.projects).map(p=>{
    let s=0;
    if(lead.budgetMax&&p.priceFrom&&p.priceFrom<=lead.budgetMax*1.1&&(!lead.budgetMin||!p.priceTo||p.priceTo>=lead.budgetMin*0.9))s+=2;
    const bd=(lead.bhk||'').match(/\d/); if(bd&&(p.configs||'').includes(bd[0]))s+=1;
    if(lead.bhk&&/plot/i.test(lead.bhk)&&p.type==='Plot')s+=1;
    if(words.some(w=>(p.location||'').toLowerCase().includes(w)))s+=1;
    return {p,s};
  }).filter(x=>x.s>=2&&!(lead.projects||[]).includes(x.p.id)).sort((a,b)=>b.s-a.s).slice(0,3);
}
function fillTpl(body,lead,extra={}){
  const ag=member(lead&&lead.assignedTo)||member(state.me)||{};
  const proj=lead&&(lead.projects||[]).map(id=>store.projects[id]).filter(Boolean)[0];
  const nv=lead&&vals(store.visits).filter(v=>v.leadId===lead.id&&v.status==='scheduled').sort((a,b)=>a.at.localeCompare(b.at))[0];
  const map={name:(lead&&lead.name||'').split(' ')[0]||'there',agent:ag.name||company(),agent_phone:ag.phone?fmtPhone(ag.phone):(settings().phone||''),company:company(),
    project:proj?proj.name:'our projects',visit_time:nv?fmtDT(nv.at):'',budget:lead?fmtBudget(lead):'',location:lead&&lead.location||'',bhk:lead&&lead.bhk||'',...extra};
  return String(body||'').replace(/\{\{\s*(\w+)\s*\}\}/g,(m,k)=>map[k]!=null?map[k]:m);
}
function parseEnquiry(text){
  const out={}; if(!text)return out; const lines=text.split(/\r?\n/);
  const grab=re=>{for(const l of lines){const m=l.replace(/^[\s•*·\-]+/,'').match(re); if(m&&m[1]&&m[1].trim().replace(/^[-–:]+/,'').trim())return m[1].trim().replace(/^[-–:]+\s*/,'')}return null};
  const SEP='\\s*(?::|–|=|-(?=\\s)|\\s-)\\s*';
  out.name=grab(new RegExp('^(?:full\\s+)?(?:name|customer name|client name|buyer name)'+SEP+'(.+)$','i'));
  const phoneM=text.match(/(?:\+?91[\s-]?)?[6-9]\d{2}[\s-]?\d{2}[\s-]?\d{5}|(?:\+?91[\s-]?)?[6-9]\d{4}[\s-]?\d{5}/);
  if(phoneM)out.phone=normPhone(phoneM[0]);
  const em=text.match(/[\w.+-]+@[\w-]+\.[\w.-]+/); if(em)out.email=em[0];
  const b=grab(new RegExp('^budget'+'.*?'+SEP+'(.+)$','i')); if(b){const pb=parseBudget(b); if(pb){out.budgetMin=pb.min;out.budgetMax=pb.max}}
  const dob=grab(new RegExp('^(?:dob|d\\.o\\.b\\.?|date of birth|birthday|birth date)'+'.*?'+SEP+'(.+)$','i')); if(dob){const d=parseDate(dob); if(d)out.dob=d}
  const pur=grab(new RegExp('^purpose'+'.*?'+SEP+'(.+)$','i')); if(pur){out.purpose=/invest/i.test(pur)&&/self|own|living|stay/i.test(pur)?'Both':/invest/i.test(pur)?'Investment':/self|own|living|stay|family/i.test(pur)?'Self use':pur}
  const slot=grab(new RegExp('^(?:preferred\\s+)?(?:time\\s*slot|slot|time to connect|preferred time|call time)'+'.*?'+SEP+'(.+)$','i')); if(slot)out.slot=slot;
  const loc=grab(new RegExp('^(?:preferred\\s+)?(?:location|city|area|locality)'+SEP+'(.+)$','i')); if(loc)out.location=loc;
  if(!out.location){const m=text.match(/\bin\s+([A-Z][\w ]{2,30}?)\s+at\s+([A-Z][\w ]{2,30})/); if(m)out.location=m[2].trim()}
  const bhk=text.match(/(\d)\s*bhk/i); if(bhk)out.bhk=(+bhk[1]>=5?'5+':bhk[1])+' BHK'; else if(/\bplot\b/i.test(text))out.bhk='Plot';
  const src=[['99acres',/99\s*acres/i],['MagicBricks',/magic\s*bricks/i],['Housing.com',/housing\.com/i],['Facebook',/facebook|\bfb\b/i],['Instagram',/instagram/i],['Website',/website/i]];
  for(const [s,re] of src)if(re.test(text)){out.source=s;break}
  if(!out.name){const m=text.match(/name\s*[:\-–]\s*([A-Za-z][A-Za-z .]{1,40})/i); if(m)out.name=m[1].trim()}
  Object.keys(out).forEach(k=>{if(out[k]==null||out[k]==='')delete out[k]});
  return out;
}

/* ============ Leads ============ */
function filteredLeads(){
  const q=state.q.trim().toLowerCase(), qd=q.replace(/\D/g,''); const f=state.f;
  return vals(store.leads).filter(l=>{
    if(q){const hay=[l.name,l.email,l.location,l.source,l.bhk,memberName(l.assignedTo)].join(' ').toLowerCase(); if(!hay.includes(q)&&!(qd.length>=3&&normPhone(l.phone).includes(qd)))return false}
    if(f.stage&&l.stage!==f.stage)return false;
    if(f.stage===''&&!q&&state.leadsMode==='list'&&f.fu===''&&false)return false;
    if(f.score&&l.score!==f.score)return false;
    if(f.source&&l.source!==f.source)return false;
    if(f.assignee==='none'&&l.assignedTo)return false;
    if(f.assignee&&f.assignee!=='none'&&l.assignedTo!==f.assignee)return false;
    if(f.project&&!(l.projects||[]).includes(f.project))return false;
    if(f.fu){const s=fuState(l.nextFollowUp); const active=!['booked','lost'].includes(l.stage);
      if(f.fu==='over'&&!(active&&s==='over'))return false; if(f.fu==='today'&&!(active&&s==='today'))return false;
      if(f.fu==='due'&&!(active&&(s==='over'||s==='today')))return false; if(f.fu==='none'&&!(active&&!l.nextFollowUp&&l.stage!=='new'))return false}
    return true;
  });
}

    <span class="muted" style="margin-left:auto">${list.length} lead${list.length===1?'':'s'}</span>

  if(!vals(store.leads).length)return topBar('Leads')+filters+`<div class="panel"><div class="empty"><h2 style="margin-bottom:6px">No leads yet</h2>Add a lead by hand, paste an enquiry from 99acres or WhatsApp, or import your Excel sheet.<div class="quick" style="justify-content:center;margin-top:12px"><button class="btn primary" data-act="addLead">${ic.plus}Add lead</button><button class="btn" data-act="import">Import Excel / CSV</button></div></div></div>`;
  if(state.leadsMode==='board')return topBar('Leads')+filters+board(list);
  return topBar('Leads')+filters+`<section class="panel"><div class="rows">${rowHead}${list.length?list.slice(0,state.limit).map(leadRow).join(''):'<div class="empty">No leads match these filters.</div>'}</div>
    ${list.length>state.limit?`<div class="empty"><button class="btn" data-act="moreRows">Show ${Math.min(80,list.length-state.limit)} more</button></div>`:''}</section>`;

/* ============ Visits ============ */
function viewVisits(){
  const all=vals(store.visits).filter(v=>store.leads[v.leadId]);
  const n=now(); n.setHours(0,0,0,0);
  const tab=state.visitTab;
  let list=tab==='upcoming'?all.filter(v=>v.status==='scheduled').sort((a,b)=>a.at.localeCompare(b.at)):all.filter(v=>v.status!=='scheduled').sort((a,b)=>b.at.localeCompare(a.at));
  const groups={}; list.forEach(v=>{const k=new Date(v.at).toDateString(); (groups[k]=groups[k]||[]).push(v)});
  const done=all.filter(v=>v.status==='done').length, ns=all.filter(v=>v.status==='noshow').length;
  return topBar('Site visits',`<button class="btn" data-act="newVisit">${ic.plus}Schedule visit</button>`)+`
  <div class="filters"><div class="seg"><button data-act="vtab" data-v="upcoming" class="${tab==='upcoming'?'on':''}">Upcoming</button><button data-act="vtab" data-v="past" class="${tab==='past'?'on':''}">Done & missed</button></div>
  <span class="muted" style="margin-left:auto">${done} done · ${ns} no-show${done+ns?` · ${Math.round(done/(done+ns)*100)}% showed up`:''}</span></div>
  <section class="panel">${Object.keys(groups).length?Object.entries(groups).map(([k,vs])=>`<div class="day-h">${esc(new Date(k).toLocaleDateString('en-IN',{weekday:'long',day:'numeric',month:'long'}))}</div><div class="rows">${vs.map(visitRow).join('')}</div>`).join(''):`<div class="empty">${tab==='upcoming'?'No visits planned. Open a lead and press Visit to book one.':'No finished visits yet.'}</div>`}</section>`;
}

/* ============ Reports ============ */
function viewReports(){
  const days=state.reportDays, since=days?Date.now()-days*86400000:0;
  const L=vals(store.leads).filter(l=>!since||new Date(l.createdAt).getTime()>=since);
  const V=vals(store.visits).filter(v=>!since||new Date(v.at).getTime()>=since);
  const total=L.length;
  const reach=STAGES.map((s,i)=>({s,c:L.filter(l=>(l.maxStage??STAGE_IDX[l.stage]??0)>=i).length}));
  const months=days?days/30:Math.max(1,(Date.now()-Math.min(...vals(store.leads).map(l=>new Date(l.createdAt).getTime()),Date.now()))/(30*86400000));
  const spend=settings().spend||{};
  const bySrc=sources().map(s=>{const ls=L.filter(l=>l.source===s); const sp=(+spend[s]||0)*months; const bk=ls.filter(l=>l.stage==='booked').length; return {s,n:ls.length,cont:ls.filter(l=>(l.maxStage??0)>=1).length,vis:ls.filter(l=>(l.maxStage??0)>=4).length,bk,sp,cpl:ls.length&&sp?sp/ls.length:null,cpb:bk&&sp?sp/bk:null}}).filter(r=>r.n||r.sp);
  const maxN=Math.max(1,...bySrc.map(r=>r.n));
  const team=teamList().map(m=>{const ls=L.filter(l=>l.assignedTo===m.id); const all=vals(store.leads).filter(l=>l.assignedTo===m.id); return {m,n:ls.length,cont:ls.filter(l=>(l.maxStage??0)>=1).length,vis:V.filter(v=>v.agent===m.id&&v.status==='done').length,bk:ls.filter(l=>l.stage==='booked').length,over:all.filter(l=>!['booked','lost'].includes(l.stage)&&fuState(l.nextFollowUp)==='over').length}});
  const lost=L.filter(l=>l.stage==='lost'); const lr={}; lost.forEach(l=>{const k=l.lostReason||'No reason given'; lr[k]=(lr[k]||0)+1});
  const lrMax=Math.max(1,...Object.values(lr));
  const vDone=V.filter(v=>v.status==='done').length, vNs=V.filter(v=>v.status==='noshow').length;
  const rs=`<div class="seg">${[[7,'7 days'],[30,'30 days'],[90,'90 days'],[0,'All time']].map(([d,l])=>`<button data-act="rdays" data-v="${d}" class="${days===d?'on':''}">${l}</button>`).join('')}</div>`;
  const inr=n=>n==null?'—':'₹'+Math.round(n).toLocaleString('en-IN');
  return topBar('Reports',rs)+`
  <div class="kpis">
    <div class="kpi"><div class="label">Leads in</div><div class="n">${total}</div></div>
    <div class="kpi"><div class="label">Reached by phone</div><div class="n">${total?Math.round(reach[1].c/total*100):0}%</div></div>
    <div class="kpi"><div class="label">Visits done</div><div class="n">${vDone}</div><div class="hint">${vDone+vNs?Math.round(vDone/(vDone+vNs)*100)+'% showed up':''}</div></div>
    <div class="kpi"><div class="label">Bookings</div><div class="n">${reach[7].c}</div><div class="hint">${total?((reach[7].c/total)*100).toFixed(1)+'% of leads':''}</div></div>
  </div>
  <div class="grid2"><div class="stack">
    <section class="panel"><div class="panel-h"><h2>Where leads drop off</h2><span class="muted">How many leads reached each stage</span></div><div class="panel-b funnel">
      ${total?reach.map((r,i)=>{const prev=i?reach[i-1].c:r.c; return `<div class="fbar"><div>${esc(r.s.l)}</div><div class="track"><div class="fill ${r.s.k==='booked'?'booked':''}" style="width:${(r.c/total*100).toFixed(1)}%"></div></div><div class="num">${r.c}${i&&prev?` · ${Math.round(r.c/prev*100)}%`:''}</div></div>`}).join('')+`<div class="hint">The % on the right is how many moved on from the stage above.</div>`:'<div class="empty">No leads in this period.</div>'}</div></section>
    <section class="panel"><div class="panel-h"><h2>Which source is worth the money</h2><span class="muted">Add monthly spend in Settings</span></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Source</th><th class="n">Leads</th><th></th><th class="n">Reached</th><th class="n">Visited</th><th class="n">Booked</th><th class="n">Spend</th><th class="n">Per lead</th><th class="n">Per booking</th></tr></thead><tbody>
      ${bySrc.length?bySrc.sort((a,b)=>b.n-a.n).map(r=>`<tr><td>${esc(r.s)}</td><td class="n">${r.n}</td><td style="width:90px"><div class="hbar" style="width:${r.n/maxN*100}%"></div></td><td class="n">${r.n?Math.round(r.cont/r.n*100)+'%':'—'}</td><td class="n">${r.vis}</td><td class="n">${r.bk}</td><td class="n">${r.sp?inr(r.sp):'—'}</td><td class="n">${inr(r.cpl)}</td><td class="n">${inr(r.cpb)}</td></tr>`).join(''):'<tr><td colspan="9" class="muted">No leads in this period.</td></tr>'}</tbody></table></div></section>
  </div><div class="stack">
    <section class="panel"><div class="panel-h"><h2>Team</h2></div><div class="tbl-wrap"><table class="tbl"><thead><tr><th>Name</th><th class="n">Leads</th><th class="n">Reached</th><th class="n">Visits</th><th class="n">Booked</th><th class="n">Overdue</th></tr></thead><tbody>
      ${team.length?team.map(r=>`<tr><td>${esc(r.m.name)}</td><td class="n">${r.n}</td><td class="n">${r.n?Math.round(r.cont/r.n*100)+'%':'—'}</td><td class="n">${r.vis}</td><td class="n">${r.bk}</td><td class="n" style="color:${r.over?'var(--hot)':'inherit'}">${r.over}</td></tr>`).join(''):'<tr><td colspan="6" class="muted">Add your team in Settings.</td></tr>'}</tbody></table></div></section>
    <section class="panel"><div class="panel-h"><h2>Why leads were lost</h2><span class="muted">${lost.length}</span></div><div class="panel-b funnel">
      ${lost.length?Object.entries(lr).sort((a,b)=>b[1]-a[1]).map(([k,c])=>`<div class="fbar"><div>${esc(k)}</div><div class="track"><div class="fill" style="width:${c/lrMax*100}%;background:var(--hot);opacity:.7"></div></div><div class="num">${c}</div></div>`).join(''):'<div class="hint">No lost leads in this period.</div>'}</div></section>
  </div></div>`;
}

  const ex=leadByPhone(d.phone);
  if(ex){upd('leads',ex.id,l=>{leadActivity(l,'enquiry',`New enquiry again${d.source?' from '+d.source:''}${d.note?': '+d.note:''}`); if(d.source&&!l.source)l.source=d.source; if(d.project&&!(l.projects||[]).includes(d.project))l.projects=[...(l.projects||[]),d.project]; if(l.score==='cold')l.score='warm'; ['email','dob','location','slot','purpose','bhk','propertyType'].forEach(k=>{if(d[k]&&!l[k])l[k]=d[k]}); if(!l.budgetMax&&d.budgetMax){l.budgetMax=d.budgetMax;l.budgetMin=d.budgetMin} if(l.stage==='lost'){l.stage='new'; leadActivity(l,'stage','Reopened after a new enquiry')} if(!l.nextFollowUp)l.nextFollowUp=new Date().toISOString()});
    closeModal(); toast(`Added to ${ex.name}'s existing lead`); state.openLead=ex.id; scheduleRender(); return}
  const t=new Date().toISOString();

function saveCall(id){
  const ob=document.querySelector('#lc-out button.on'); const o=OUTCOMES.find(x=>x.k===(ob&&ob.dataset.v))||OUTCOMES[0];

function parseCSV(text){const rows=[];let row=[],f='',q=false; const delim=(text.split('\n')[0].match(/\t/g)||[]).length>(text.split('\n')[0].match(/,/g)||[]).length?'\t':',';
  for(let i=0;i<text.length;i++){const c=text[i]; if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}else{if(c==='"')q=true; else if(c===delim){row.push(f);f=''} else if(c==='\n'){row.push(f);rows.push(row);row=[];f=''} else if(c!=='\r')f+=c}}
  if(f||row.length){row.push(f);rows.push(row)} return rows.filter(r=>r.some(x=>String(x).trim()))}
function loadXLSX(){return new Promise((res,rej)=>{if(window.XLSX)return res(window.XLSX); const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'; s.onload=()=>res(window.XLSX); s.onerror=()=>rej(); document.head.appendChild(s)})}
async function readImportFile(file){
  try{
    let rows;
    if(/\.xlsx?$/i.test(file.name)){const X=await loadXLSX(); const wb=X.read(await file.arrayBuffer(),{type:'array'}); rows=X.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1,raw:false,defval:''})}
    else rows=parseCSV(await file.text());
    prepImport(rows);
  }catch(e){document.getElementById('imp-prev').innerHTML='<div class="err">Could not read that file. Save it as .xlsx or .csv and try again.</div>'}
}
function prepImport(rows){
  const box=document.getElementById('imp-prev'); if(!rows||rows.length<2){box.innerHTML='<div class="err">Need a header row and at least one lead.</div>';return}
  const hdr=rows[0].map(h=>String(h).toLowerCase().replace(/[_.]/g,' ').replace(/\s+/g,' ').trim());
  const map={}; Object.entries(HMAP).forEach(([k,names])=>{const i=hdr.findIndex(h=>names.includes(h)); if(i>=0)map[k]=i});
  if(map.name==null||map.phone==null){box.innerHTML=`<div class="err">Could not find a Name column and a Mobile column. Columns found: ${esc(rows[0].join(', '))}</div>`;return}
  const seen=new Set(); const items=[]; let dupFile=0,dupDb=0,bad=0;
  rows.slice(1).forEach(r=>{const g=k=>map[k]!=null?String(r[map[k]]||'').trim():''; const ph=normPhone(g('phone')); if(ph.length<10||!g('name')){bad++;return} if(seen.has(ph)){dupFile++;return} seen.add(ph); const ex=leadByPhone(ph); if(ex)dupDb++;
    const b=parseBudget(g('budget')); const bk=(g('bhk').match(/(\d)/)||[])[1];
    items.push({ex:ex&&ex.id,name:g('name'),phone:ph,email:g('email'),location:g('location'),source:g('source'),notes:g('notes'),budgetMin:b?b.min:null,budgetMax:b?b.max:null,bhk:bk?(+bk>=5?'5+':bk)+' BHK':'',dob:parseDate(g('dob'))||''})});
  IMPORT=items;
  box.innerHTML=`<div class="sec"><div><b>${items.length-dupDb}</b> new leads ready. ${dupDb?`<b>${dupDb}</b> already in your CRM (they get a note, not a copy). `:''}${dupFile?`${dupFile} repeated rows skipped. `:''}${bad?`${bad} rows skipped for a missing name or mobile.`:''}</div>
    <div class="form"><div class="field"><label class="label" for="imp-src">Source for rows without one</label><select id="imp-src">${sources().map(s=>`<option ${s==='Bulk call'?'':''}>${esc(s)}</option>`).join('')}</select></div>
    <div class="field"><label class="label" for="imp-asg">Assign to</label><select id="imp-asg"><option value="">Not assigned</option><option value="rr">Share evenly across the team</option>${teamList().map(m=>`<option value="${esc(m.id)}">${esc(m.name)}</option>`).join('')}</select></div>
    <div class="field"><label class="label" for="imp-proj">Project</label><select id="imp-proj"><option value="">—</option>${vals(store.projects).map(p=>`<option value="${esc(p.id)}">${esc(p.name)}</option>`).join('')}</select></div></div>
    <div class="tbl-wrap"><table class="tbl"><thead><tr><th>Name</th><th>Mobile</th><th>Budget</th><th>Location</th><th></th></tr></thead><tbody>${items.slice(0,6).map(i=>`<tr><td>${esc(i.name)}</td><td class="mono">${esc(fmtPhone(i.phone))}</td><td>${esc(fmtBudget(i))}</td><td>${esc(i.location)}</td><td>${i.ex?'<span class="chip tape">Already exists</span>':''}</td></tr>`).join('')}</tbody></table></div>${items.length>6?`<div class="hint">and ${items.length-6} more</div>`:''}</div>`;
  document.getElementById('imp-go').disabled=!items.length;
}

async function aiRun(id){

  const prompt=`You update a real-estate CRM lead in India from a salesperson's call notes (may be Hindi, Hinglish or English).

"""${txt}"""
Return ONLY a JSON object with any of these keys you can fill from the notes (omit keys not mentioned):

}

    vals(store.visits).filter(v=>v.leadId===d.id).forEach(v=>upd('visits',v.id,x=>{x.leadId=d.into}));
    removeDoc('leads',d.id); state.openLead=d.into; toast('Duplicates merged')},
  delLead:(d,el)=>{if(el.dataset.sure){vals(store.visits).filter(v=>v.leadId===d.id).forEach(v=>removeDoc('visits',v.id)); removeDoc('leads',d.id); state.openLead=null; toast('Lead deleted'); return} el.dataset.sure='1'; el.innerHTML='Press again to delete for good'},
  newVisit:d=>visitModal(d.id||null), editVisit:d=>visitModal(null,d.id), saveVisit:d=>saveVisit(d.id),
  visitDone:d=>visitDoneModal(d.id), saveVisitDone:d=>saveVisitDone(d.id),
  delVisit:(d,el)=>{if(el.dataset.sure){removeDoc('visits',d.id);closeModal();toast('Visit deleted');return} el.dataset.sure='1'; el.textContent='Press again to delete'},
  vtab:d=>{state.visitTab=d.v;render()},
  editProject:d=>projectModal(d.id),
  saveProject:d=>{const name=val('pf-name'), pf=parseFloat(val('pf-priceFrom')); if(!name||!pf){document.getElementById('pf-err').innerHTML='<div class="err">Add the project name and starting price in lakh.</div>';return}
    const p={...(d.id?store.projects[d.id]:{id:uid(),createdAt:new Date().toISOString()}),name,developer:val('pf-developer'),location:val('pf-location'),rera:val('pf-rera'),type:val('pf-type'),configs:val('pf-configs'),priceFrom:pf,priceTo:parseFloat(val('pf-priceTo'))||null,status:val('pf-status'),possession:val('pf-possession'),amenities:val('pf-amenities'),link:val('pf-link')};
    save('projects',JSON.parse(JSON.stringify(p))); closeModal(); toast('Project saved')},
  delProject:(d,el)=>{if(el.dataset.sure){removeDoc('projects',d.id);closeModal();toast('Project deleted');return} el.dataset.sure='1'; el.textContent='Press again to delete'},
  projLeads:d=>{state.f={stage:'',score:'',source:'',assignee:'',project:d.id,fu:''};state.view='leads';render()},
  editTpl:d=>tplModal(d.id),
  insVar:d=>{const ta=document.getElementById('tf-body'); const s=ta.selectionStart??ta.value.length; ta.value=ta.value.slice(0,s)+'{{'+d.v+'}}'+ta.value.slice(ta.selectionEnd??s); ta.focus(); IN.tplPrev()},
  saveTpl:d=>{const body=val('tf-body'); if(!body){toast('Write the message first');return} const t={...(d.id?store.templates[d.id]:{id:uid()}),name:val('tf-name')||val('tf-use'),use:val('tf-use'),body}; save('templates',JSON.parse(JSON.stringify(t))); closeModal(); toast('Template saved')},
  delTpl:(d,el)=>{if(el.dataset.sure){removeDoc('templates',d.id);closeModal();return} el.dataset.sure='1'; el.textContent='Press again to delete'},
  defaultTpls:()=>{DEFAULT_TPLS.forEach(t=>save('templates',{id:uid(),...t})); toast('Standard templates added')},
  editMember:d=>memberModal(d.id),
  saveMember:d=>{const name=val('mf-name'); if(!name){document.getElementById('mf-err').innerHTML='<div class="err">Add a name.</div>';return}
    const m={...(d.id?store.team[d.id]:{id:uid()}),name,phone:normPhone(val('mf-phone')),role:val('mf-role'),active:val('mf-active')!=='0'}; save('team',JSON.parse(JSON.stringify(m)));
    if(!state.me){state.me=m.id;lsSet('ed-me',m.id)} closeModal(); toast('Saved')},
  delMember:(d,el)=>{if(el.dataset.sure){removeDoc('team',d.id);if(state.me===d.id){state.me='';lsSet('ed-me','')}closeModal();return} el.dataset.sure='1'; el.textContent='Press again to remove'},
  saveCompany:()=>{const s={...settings(),id:'settings',company:val('s-company'),phone:val('s-phone'),appName:val('s-appname'),autoAssign:val('s-rr')}; save('meta',s); toast('Saved')},
  saveSources:()=>{const list=val('s-sources').split('\n').map(x=>x.trim()).filter(Boolean); const spend={}; document.querySelectorAll('[data-src]').forEach(i=>{if(i.value!=='')spend[i.dataset.src]=+i.value}); save('meta',{...settings(),id:'settings',sources:[...new Set(list)],spend}); toast('Sources saved')},
  askClear:()=>{state.confirmClear=true;render()}, cancelClear:()=>{state.confirmClear=false;render()},
  clearSample:()=>{COLS.forEach(c=>vals(store[c]).filter(x=>x.sample).forEach(x=>removeDoc(c,x.id))); if(state.me&&store.team[state.me]===undefined){state.me='';lsSet('ed-me','')} state.confirmClear=false; toast('Example data removed')},
  import:()=>importModal(),
  impPaste:()=>prepImport(parseCSV(val('imp-paste'))),
  impGo:()=>runImport(),
  export:()=>exportLeads(),
  copyExp:()=>copyText(val('exp-txt')),
  rdays:d=>{state.reportDays=+d.v;render()},
  closeModal:()=>closeModal(),
  modalBg:(d,el,e)=>{if(e.target===el)closeModal()},
};
const CH={
  me:e=>{state.me=e.target.value;lsSet('ed-me',state.me);state.scope=state.me?'mine':'all';render()},
  f:e=>{state.f[e.target.dataset.k]=e.target.value;state.limit=80;render()},
  leadField:e=>{const t=e.target; upd('leads',t.dataset.id,l=>{const before=l[t.dataset.k]; l[t.dataset.k]=t.value; if(t.dataset.k==='assignedTo'&&before!==t.value)leadActivity(l,'note',t.value?'Assigned to '+memberName(t.value):'Unassigned')})},
  fuCustom:e=>{const v=fromLocalInput(e.target.value); if(v){upd('leads',e.target.dataset.id,l=>{l.nextFollowUp=v}); toast('Follow-up set for '+fmtDT(v))}},
  addProj:e=>{const p=e.target.value; if(p)A.addProjBtn({id:e.target.dataset.id,p})},
  waTpl:e=>{const l=store.leads[e.target.dataset.id], t=store.templates[e.target.value]; const txt=t?fillTpl(t.body,l):'Hi '+(l.name||'').split(' ')[0]+', '; document.getElementById('wa-text').value=txt; IN.waText()},
  impFile:e=>{const f=e.target.files[0]; if(f)readImportFile(f)},
};
const IN={
  gsearch:e=>{state.q=e.target.value; if(state.view!=='leads'){state.view='leads'} state.limit=80; render()},
  noteDraft:e=>{state.noteDraft[e.target.dataset.id]=e.target.value},
  dupCheck:()=>dupCheck(),
  budgetPrev:()=>budgetPrev(),
  tplPrev:()=>{const p=document.getElementById('tf-prev'); if(p)p.textContent=fillTpl(val('tf-body'),vals(store.leads)[0]||{name:'Rahul Mehta'})},
  waText:()=>{const a=document.getElementById('wa-go'); const l=store.leads[a&&a.dataset.id]; if(a&&l)a.href=waHref(l.phone,document.getElementById('wa-text').value)},
};
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]'); if(!el)return; const fn=A[el.dataset.act]; if(!fn)return; if(el.tagName==='A'&&el.getAttribute('href')==='#')e.preventDefault(); fn(el.dataset,el,e)});
document.addEventListener('change',e=>{const k=e.target.dataset&&e.target.dataset.chg; if(k&&CH[k])CH[k](e)});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.inp; if(k&&IN[k])IN[k](e); if(e.target.id==='wa-text')IN.waText()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){if(document.getElementById('modal-root').innerHTML)closeModal(); else if(state.openLead){state.openLead=null;render()}}});
document.addEventListener('dragstart',e=>{const c=e.target.closest&&e.target.closest('[data-drag]'); if(c){e.dataTransfer.setData('text/plain',c.dataset.drag);e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{const c=e.target.closest&&e.target.closest('[data-drop]'); if(c){e.preventDefault();document.querySelectorAll('.col.over').forEach(x=>x!==c&&x.classList.remove('over'));c.classList.add('over')}});
document.addEventListener('dragleave',e=>{const c=e.target.closest&&e.target.closest('[data-drop]'); if(c&&!c.contains(e.relatedTarget))c.classList.remove('over')});
document.addEventListener('drop',e=>{const c=e.target.closest&&e.target.closest('[data-drop]'); if(!c)return; e.preventDefault(); c.classList.remove('over'); const id=e.dataTransfer.getData('text/plain'); if(!id||!store.leads[id])return; const st=c.dataset.drop; if(st==='lost'){lostModal(id);return} upd('leads',id,l=>setStageOn(l,st)); if(st==='visit'&&!vals(store.visits).some(v=>v.leadId===id&&v.status==='scheduled'))visitModal(id)});
setInterval(()=>{if(!document.getElementById('modal-root').innerHTML&&!(document.activeElement&&/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)))scheduleRender()},60000);
boot();
</script>
